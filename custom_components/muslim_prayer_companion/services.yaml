get_prayer_times:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: muslim_prayer_companion
    date:
      required: false
      example: "2026-03-01"
      selector:
        date:
    days:
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 366
          mode: box
