name: Mosque sources health check

# Every mosque source in data/mosques.json is fetched and parsed with the
# integration's own parsers once a week. If one breaks (as the ICCI JSON API
# did in 2026), an issue is opened or updated instead of users finding out
# months later.

on:
  schedule:
    - cron: "15 6 * * 1" # Mondays 06:15 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Fetch and parse every mosque source
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Check the sources
        id: check
        run: python scripts/check_mosques.py --report mosque-health.md
      - name: Open or update an issue
        if: failure() && steps.check.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Mosque prayer-time source check failed"
          body="$(cat mosque-health.md)"$'\n\n'"Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing="$(gh issue list --label mosque-source --state open --search "$title in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create mosque-source --description "A mosque prayer-time source is broken" --color D93F0B || true
            gh issue create --title "$title" --label mosque-source --body "$body"
          fi
