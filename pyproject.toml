[project]
name = "muslim-prayer-companion"
version = "3.0.0"
description = "Muslim Prayer Companion for Home Assistant - provides prayer times, Iqamah times, Hijri calendar, and Islamic companion features"
authors = [
    {name = "Abdelrahman Maharek", email = "abdelrahman.mahareek@gmail.com"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "prayer-times-calculator>=0.0.12",
    "hijri-converter>=2.3.1",
]

[project.optional-dependencies]
dev = [
    "homeassistant>=2024.10.3",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-homeassistant-custom-component>=0.13.174",
    "pytest-cov>=4.0",
    "ruff>=0.9",
    "pre-commit>=3.0",
    "black>=21.12b0",
    "codespell>=2.0.0",
    "yamllint>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["custom_components/muslim_prayer_companion"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

# Ruff config is in .ruff.toml (takes precedence)

[tool.codespell]
skip = "./.*,*.csv,*.json,*.lock"
quiet-level = 2
ignore-words-list = "hass"

[tool.bandit]
skips = ["B101", "B404", "B603"]
