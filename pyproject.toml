[project]
name = "muslim-prayer-companion"
version = "4.0.0"
description = "Muslim Prayer Companion for Home Assistant - prayer times, Iqamah, Friday prayers, Hijri calendar and Islamic companion sensors"
authors = [
    {name = "Abdelrahman Maharek", email = "abdelrahman.mahareek@gmail.com"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
# Home Assistant 2025.2 (the minimum in hacs.json) already requires Python 3.13.
requires-python = ">=3.13"

# Must match custom_components/muslim_prayer_companion/manifest.json (tests check it).
dependencies = [
    "prayer-times-calculator-offline==1.0.3",
    "hijridate==2.3.0",
]

[project.optional-dependencies]
dev = [
    "homeassistant>=2025.2.4",
    # Brings pytest, pytest-asyncio, pytest-cov, pytest-socket, pytest-timeout,
    # freezegun/pytest-freezer and syrupy, pinned to the Home Assistant version.
    "pytest-homeassistant-custom-component>=0.13.214",
    "ruff==0.17.1",
    "pre-commit>=4.0",
    "codespell>=2.4",
    "yamllint>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["custom_components/muslim_prayer_companion"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:sugar --strict-markers --timeout=60"
filterwarnings = [
    # prayer-times-calculator-offline passes re.split's maxsplit positionally.
    "ignore:'maxsplit' is passed as positional argument:DeprecationWarning",
]

[tool.coverage.run]
source = ["custom_components/muslim_prayer_companion"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false

# Ruff config is in .ruff.toml

[tool.codespell]
skip = "./.*,*.csv,*.json,*.lock,./tests/fixtures/*"
quiet-level = 2
# "ist": Irish Summer Time in the bundled timetable's source note; "nd": ordinal suffix regex.
ignore-words-list = "hass,ist,nd"

[tool.bandit]
skips = ["B101", "B404", "B603", "B310"]
